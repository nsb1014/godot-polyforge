name: Vapor derrick reference test

on:
  pull_request:
    paths:
      - "addons/polyforge/**"
      - "examples/arcane_pumpjack_recipe.gd"
      - "tests/**"
      - ".github/workflows/arcane-pumpjack-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vapor-derrick-reference-probes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_BIN: ${{ github.workspace }}/.godot-bin/godot
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install virtual display and Godot runtime libraries
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends \
            curl unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libasound2t64 libpulse0

      - name: Install pinned Godot editor
        run: |
          mkdir -p "$(dirname "$GODOT_BIN")"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          mv "$(dirname "$GODOT_BIN")/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Probe geometry and pairwise relationships
        id: geometry
        continue-on-error: true
        run: |
          timeout --kill-after=15s 120s "$GODOT_BIN" --headless --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_pumpjack_recipe.gd \
            --out res://dist/geometry --no-glb --no-viewer --no-preview --no-readability

      - name: Probe base render and export
        id: base_render
        continue-on-error: true
        run: |
          timeout --kill-after=15s 180s xvfb-run -a "$GODOT_BIN" --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_pumpjack_recipe.gd \
            --out res://dist/base --mode both --no-sweep

      - name: Probe rendered interaction sweep
        id: sweep_render
        continue-on-error: true
        run: |
          timeout --kill-after=15s 300s xvfb-run -a "$GODOT_BIN" --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_pumpjack_recipe.gd \
            --out res://dist/sweep --no-glb --no-viewer --no-preview

      - name: Run PolyForge runtime tests
        id: regression
        continue-on-error: true
        run: 'timeout --kill-after=15s 180s "$GODOT_BIN" --headless --path . --script res://tests/test_polyforge.gd'

      - name: Verify rigged review artifact contract
        id: artifact_contract
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/base")
          manifest = json.loads((root / "arcane_pumpjack.manifest.json").read_text())
          assert manifest["format_version"] == 8
          topology = manifest["topology"]["statistics"]
          assert topology["rendered_triangles"] <= 5500
          assert topology["unique_triangles"] <= 4000
          rig = manifest["rig"]
          assert any(clip["name"] == "pump_cycle" and clip["loop"] for clip in rig["clips"])
          assert len(rig["bones"]) >= 8
          assert all(report["report"]["ok"] for report in rig["motion_reports"])
          assert [stage["stage_id"] for stage in manifest["process"]["stages"]] == [
              "intent", "resolve_design", "solve_mechanism", "compile_geometry",
              "compile_appearance", "compile_rig"]
          assert manifest["style_compilation"]["geometry_hash_before"] == \
              manifest["style_compilation"]["geometry_hash_after"]
          assert rig["provenance"]["geometry_hash"] == \
              manifest["style_compilation"]["geometry_hash_after"]
          assert manifest["reference_evidence"]["ok"]
          assert manifest["reference_evidence"]["reference_image"]["sha256"] == \
              "e90f854563b3f8c19d7f30c6b67d1923ecb5727754a76b5fe68e2341ce8d5490"
          assert not manifest["visual_evidence"]["renderer_policy"][
              "cross_renderer_pixel_comparison"]
          for name in ("arcane_pumpjack.glb", "arcane_pumpjack_viewer.json",
                       "arcane_pumpjack_viewer.html", "arcane_pumpjack_turntable.png"):
              assert (root / name).stat().st_size > 0
          PY

      - name: Upload model, viewer, manifest, and render
        uses: actions/upload-artifact@v4
        with:
          name: vapor-derrick-polyforge
          path: |
            dist/base/arcane_pumpjack.glb
            dist/base/arcane_pumpjack_merged.glb
            dist/base/arcane_pumpjack.manifest.json
            dist/base/arcane_pumpjack_viewer.json
            dist/base/arcane_pumpjack_viewer.html
            dist/base/arcane_pumpjack_turntable.png
            dist/geometry/arcane_pumpjack.manifest.json
            dist/sweep/arcane_pumpjack.manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require every reliability probe
        run: |
          test "${{ steps.geometry.outcome }}" = success
          test "${{ steps.base_render.outcome }}" = success
          test "${{ steps.sweep_render.outcome }}" = success
          test "${{ steps.regression.outcome }}" = success
          test "${{ steps.artifact_contract.outcome }}" = success
