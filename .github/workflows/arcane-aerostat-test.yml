name: Arcane aerostat reference test

on:
  pull_request:
    paths:
      - "addons/polyforge/**"
      - "examples/arcane_aerostat_recipe.gd"
      - "tests/**"
      - ".github/workflows/arcane-aerostat-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcane-aerostat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-measure-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_BIN: ${{ github.workspace }}/.godot-bin/godot
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install virtual display and Godot runtime libraries
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 update
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 install -y --no-install-recommends \
            curl unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libasound2t64 libpulse0

      - name: Install pinned Godot editor
        run: |
          mkdir -p "$(dirname "$GODOT_BIN")"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          mv "$(dirname "$GODOT_BIN")/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Probe deterministic geometry and parameter boundaries
        id: geometry
        continue-on-error: true
        run: |
          timeout --kill-after=15s 150s "$GODOT_BIN" --headless --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_aerostat_recipe.gd \
            --out res://dist/geometry --no-glb --no-viewer --no-preview --no-readability

      - name: Render and export reference proof
        id: render
        continue-on-error: true
        run: |
          timeout --kill-after=15s 180s xvfb-run -a "$GODOT_BIN" --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_aerostat_recipe.gd \
            --out res://dist/base --mode both --no-sweep

      - name: Run PolyForge runtime tests
        id: regression
        continue-on-error: true
        run: 'timeout --kill-after=15s 180s "$GODOT_BIN" --headless --path . --script res://tests/test_polyforge.gd'

      - name: Verify segregated pipeline artifact contract
        id: artifact_contract
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/base")
          manifest = json.loads((root / "arcane_aerostat.manifest.json").read_text())
          assert [stage["stage_id"] for stage in manifest["process"]["stages"]] == [
              "intent", "resolve_brief", "resolve_design", "plan_assembly",
              "solve_rigid", "plan_interfaces", "compile_geometry",
              "compile_interfaces", "plan_suspension", "compile_suspension",
              "compile_appearance"]
          contracts = manifest["contracts"]
          suspension_plan = contracts["suspension_plan"]
          suspension_compilation = contracts["suspension_compilation"]
          interface_compilation = contracts["interface_compilation"]
          assert len(suspension_plan["payload"]["members"]) == 5
          assert len(suspension_compilation["payload"]["members"]) == 5
          assert suspension_plan["payload"]["input_geometry_hash"] == \
              interface_compilation["payload"]["output_geometry_hash"]
          assert suspension_compilation["payload"]["output_geometry_hash"] == \
              manifest["style_compilation"]["geometry_hash_after"]
          assert manifest["suspension_evidence"]["ok"]
          assert manifest["suspension_evidence"]["members"] == 5
          assert manifest["reference_evidence"]["ok"]
          assert manifest["cohesion_evidence"]["ok"]
          assert manifest["cohesion_evidence"]["mass_hierarchy"]["ok"]
          assert manifest["visual_evidence"]["semantic_render_ok"]
          assert manifest["topology"]["statistics"]["rendered_triangles"] <= 7000
          assert manifest["topology"]["statistics"]["unique_triangles"] <= 6500
          for name in ("arcane_aerostat.glb", "arcane_aerostat_viewer.json",
                       "arcane_aerostat_viewer.html", "arcane_aerostat_turntable.png"):
              assert (root / name).stat().st_size > 0
          PY

      - name: Upload model, viewer, manifest, and render
        uses: actions/upload-artifact@v4
        with:
          name: arcane-aerostat-polyforge
          path: |
            dist/base/arcane_aerostat.glb
            dist/base/arcane_aerostat_merged.glb
            dist/base/arcane_aerostat.manifest.json
            dist/base/arcane_aerostat_viewer.json
            dist/base/arcane_aerostat_viewer.html
            dist/base/arcane_aerostat_turntable.png
            dist/geometry/arcane_aerostat.manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require every aerostat probe
        run: |
          test "${{ steps.geometry.outcome }}" = success
          test "${{ steps.render.outcome }}" = success
          test "${{ steps.regression.outcome }}" = success
          test "${{ steps.artifact_contract.outcome }}" = success
