name: Rigid relay assembly test

on:
  pull_request:
    paths:
      - "addons/polyforge/**"
      - "examples/arcane_relay_recipe.gd"
      - "tests/**"
      - ".github/workflows/arcane-relay-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigid-relay-probes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_BIN: ${{ github.workspace }}/.godot-bin/godot
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install virtual display and Godot runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libasound2t64 libpulse0

      - name: Install pinned Godot editor
        run: |
          mkdir -p "$(dirname "$GODOT_BIN")"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          mv "$(dirname "$GODOT_BIN")/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Probe deterministic assembly and parameter boundaries
        id: geometry
        continue-on-error: true
        run: |
          timeout --kill-after=15s 150s "$GODOT_BIN" --headless --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_relay_recipe.gd \
            --out res://dist/geometry --no-glb --no-viewer --no-preview --no-readability

      - name: Probe base render and export
        id: base_render
        continue-on-error: true
        run: |
          timeout --kill-after=15s 180s xvfb-run -a "$GODOT_BIN" --path . \
            --script res://addons/polyforge/cli/polyforge_cli.gd -- \
            build res://examples/arcane_relay_recipe.gd \
            --out res://dist/base --mode both --no-sweep

      - name: Run PolyForge runtime tests
        id: regression
        continue-on-error: true
        run: 'timeout --kill-after=15s 180s "$GODOT_BIN" --headless --path . --script res://tests/test_polyforge.gd'

      - name: Verify solved-assembly artifact contract
        id: artifact_contract
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/base")
          manifest = json.loads((root / "arcane_relay.manifest.json").read_text())
          assert manifest["format_version"] == 8
          assert [stage["stage_id"] for stage in manifest["process"]["stages"]] == [
              "intent", "resolve_brief", "resolve_design", "propose_candidates",
              "repair_candidates", "select_candidate", "plan_assembly", "solve_rigid",
              "plan_interfaces", "compile_geometry", "compile_interfaces",
              "compile_appearance"]
          contracts = manifest["contracts"]
          candidates = contracts["candidate_repair_report"]["payload"]["candidates"]
          assert len(candidates) == 2
          assert any(item["repair_count"] == 1 and item["status"] == "solved"
                     for item in candidates)
          assert contracts["candidate_selection"]["payload"][
              "selected_candidate_id"] == "baseline"
          plan = contracts["assembly_plan"]
          solved = contracts["solved_assembly"]
          interface_plan = contracts["interface_plan"]
          interface_compilation = contracts["interface_compilation"]
          assert solved["artifact_type"] == "solved_assembly"
          assert solved["payload"]["solver"]["id"] == "polyforge.rigid.socket_assembly"
          assert len(plan["payload"]["connections"]) == 5
          assert all(item["ok"] for item in solved["payload"]["residuals"])
          assert interface_plan["payload"]["solved_assembly_hash"]
          assert len(interface_plan["payload"]["treatments"]) == 5
          assert len(interface_compilation["payload"]["connections"]) == 5
          assert all(item["a_overlap"] >= item["minimum_endpoint_overlap"] and
                     item["b_overlap"] >= item["minimum_endpoint_overlap"]
                     for item in interface_compilation["payload"]["connections"])
          assert interface_compilation["payload"]["base_geometry_hash"] != \
              interface_compilation["payload"]["output_geometry_hash"]
          assert manifest["socket_contracts"]
          assert manifest["style_compilation"]["geometry_hash_before"] == \
              manifest["style_compilation"]["geometry_hash_after"]
          topology = manifest["topology"]["statistics"]
          assert topology["rendered_triangles"] <= 3200
          assert topology["unique_triangles"] <= 2600
          assert manifest["visual_evidence"]["semantic_render_ok"]
          assert manifest["cohesion_evidence"]["ok"]
          assert manifest["cohesion_evidence"]["mass_hierarchy"]["ok"]
          assert manifest["cohesion_evidence"]["mass_hierarchy"]["score"] > 0.0
          assert 0.0 < manifest["cohesion_evidence"]["mass_hierarchy"][
              "confidence"] <= 1.0
          assert not manifest["visual_evidence"]["renderer_policy"][
              "cross_renderer_pixel_comparison"]
          for name in ("arcane_relay.glb", "arcane_relay_viewer.json",
                       "arcane_relay_viewer.html", "arcane_relay_turntable.png"):
              assert (root / name).stat().st_size > 0
          PY

      - name: Upload model, viewer, manifest, and render
        uses: actions/upload-artifact@v4
        with:
          name: rigid-relay-polyforge
          path: |
            dist/base/arcane_relay.glb
            dist/base/arcane_relay_merged.glb
            dist/base/arcane_relay.manifest.json
            dist/base/arcane_relay_viewer.json
            dist/base/arcane_relay_viewer.html
            dist/base/arcane_relay_turntable.png
            dist/geometry/arcane_relay.manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require every assembly probe
        run: |
          test "${{ steps.geometry.outcome }}" = success
          test "${{ steps.base_render.outcome }}" = success
          test "${{ steps.regression.outcome }}" = success
          test "${{ steps.artifact_contract.outcome }}" = success
